<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surlap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 디자인 핸드오프(2026) 토큰 — 마스코트·그라데이션 없음. */
  :root {
    --bg: #FBFBF9;
    --surface: #F1F1ED;
    --card: #FFFFFF;
    --text: #0F0F0E;
    --divider: rgba(15, 15, 14, .10);
    --accent: #1B4DFF;
    --accent-700: #0F31B8;
    --sig: #D8FF3D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C0C0B;
      --surface: #1A1A18;
      --card: #161615;
      --text: #F4F4EF;
      --divider: rgba(244, 244, 239, .14);
      --accent: #8AA4FF;
      --accent-700: #B6C5FF;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system,
                 "Apple SD Gothic Neo", Roboto, sans-serif;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
  }

  .card { width: 100%; max-width: 420px; }

  h1 {
    font-size: 54px;
    letter-spacing: -.04em;
    line-height: 1;
    margin: 0;
    font-weight: 600;
  }

  /* "오늘" 신호와 같은 라임 — 워드마크 아래 한 줄에만 쓴다. */
  .sig {
    width: 60px;
    height: 8px;
    border-radius: 999px;
    background: var(--sig);
    margin: 16px 0 0;
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    margin: 24px 0 0;
    color: color-mix(in srgb, var(--text) 62%, transparent);
  }

  nav { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }

  a {
    display: block;
    padding: 13px 18px;
    border-radius: 999px;
    border: 1px solid var(--divider);
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }
  a:hover { border-color: var(--accent); color: var(--accent); }

  a.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  a.primary:hover { background: var(--accent-700); border-color: var(--accent-700); color: var(--bg); }

  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer {
    margin-top: 24px;
    font-size: 11.5px;
    line-height: 1.6;
    color: color-mix(in srgb, var(--text) 45%, transparent);
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Surlap</h1>
    <div class="sig"></div>
    <p>학교 시간표·급식·학사일정부터 개인 일정·할 일·기록까지, 하나의 캘린더로.</p>
    <nav>
      <a class="primary" href="./surlap-2.0-preview/">Surlap 2.0 앱 미리보기 · 실제 동작</a>
      <a href="./prototype/">디자인 프로토타입 · 30개 화면</a>
      <a href="./privacy.html">개인정보처리방침</a>
      <a href="./terms.html">이용약관</a>
      <a href="./account-delete.html">계정 삭제 요청</a>
      <a href="mailto:kev208dev@gmail.com">지원 · 문의</a>
    </nav>
    <footer>Android · 한국어</footer>
  </main>
</body>
</html>
